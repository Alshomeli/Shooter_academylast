<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نسيت كلمة المرور | أكاديمية شوتر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(5, 150, 105, 0.10) 0%, transparent 50%),
        linear-gradient(160deg, #0f172a 0%, #020617 50%, #0f172a 100%);
      color: #e2e8f0;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 25% 30%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 75% 70%, rgba(245, 158, 11, 0.04) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrap {
      position: relative;
      margin-bottom: 1.5rem;
      animation: fade-in-down 0.7s ease-out;
    }

    .logo-glow {
      position: absolute;
      inset: -8px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(245, 158, 11, 0.3));
      border-radius: 50%;
      filter: blur(20px);
      opacity: 0.6;
      animation: pulse 3s ease-in-out infinite;
    }

    .logo {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: contain;
      box-shadow:
        0 0 0 4px rgba(16, 185, 129, 0.15),
        0 8px 32px rgba(0, 0, 0, 0.4);
      background: radial-gradient(circle, #064e3b 0%, #022c22 100%);
    }

    .academy-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 0.25rem;
      animation: fade-in-down 0.7s ease-out 0.1s both;
    }

    .tagline {
      font-size: 0.9rem;
      font-weight: 600;
      color: #6ee7b7;
      margin-bottom: 2rem;
      animation: fade-in-down 0.7s ease-out 0.2s both;
    }

    .card {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: fade-in-up 0.7s ease-out 0.3s both;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .card-subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .field { margin-bottom: 1.5rem; }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }

    .field input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: #f1f5f9;
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(71, 85, 105, 0.6);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input::placeholder { color: #475569; }

    .field input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
      box-shadow: 0 6px 28px rgba(16, 185, 129, 0.4);
    }

    .back-link {
      display: block;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: #6ee7b7;
      text-decoration: none;
      margin-top: 1.5rem;
      transition: color 0.2s;
    }

    .back-link:hover { color: #34d399; text-decoration: underline; }

    .footer {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #475569;
      animation: fade-in-up 0.7s ease-out 0.5s both;
    }

    .footer p { font-weight: 600; }

    @keyframes fade-in-down {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    @media (max-width: 480px) {
      .logo { width: 84px; height: 84px; }
      .academy-name { font-size: 1.3rem; }
      .card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <img
        src="https://shooter-academy-new-1vvk.bolt.host/copilot_image_1776165482483-300x300.png"
        alt="شعار أكاديمية شوتر"
        class="logo">
    </div>

    <h1 class="academy-name">أكاديمية شوتر</h1>
    <p class="tagline">فلسفة كرة القدم</p>

    <div class="card">
      <h2 class="card-title">استعادة كلمة المرور</h2>
      <p class="card-subtitle">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور</p>

      <form action="forgot-password.html" method="post">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary">إرسال رابط الاستعادة</button>
      </form>

      <a href="landing.html" class="back-link">&larr; العودة لتسجيل الدخول</a>
    </div>

    <div class="footer">
      <p>&copy; 2026 Shooter Academy</p>
    </div>
  </div>
</body>
</html>
