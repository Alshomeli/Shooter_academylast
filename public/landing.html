<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أكاديمية شوتر | فلسفة كرة القدم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(5, 150, 105, 0.10) 0%, transparent 50%),
        linear-gradient(160deg, #0f172a 0%, #020617 50%, #0f172a 100%);
      color: #e2e8f0;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 25% 30%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 75% 70%, rgba(245, 158, 11, 0.04) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrap {
      position: relative;
      margin-bottom: 1.5rem;
      animation: fade-in-down 0.7s ease-out;
    }

    .logo-glow {
      position: absolute;
      inset: -8px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(245, 158, 11, 0.3));
      border-radius: 50%;
      filter: blur(20px);
      opacity: 0.6;
      animation: pulse 3s ease-in-out infinite;
    }

    .logo {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: contain;
      box-shadow:
        0 0 0 4px rgba(16, 185, 129, 0.15),
        0 8px 32px rgba(0, 0, 0, 0.4);
      background: radial-gradient(circle, #064e3b 0%, #022c22 100%);
    }

    .academy-name {
      font-size: 1.75rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
      animation: fade-in-down 0.7s ease-out 0.1s both;
    }

    .tagline {
      font-size: 0.95rem;
      font-weight: 600;
      color: #6ee7b7;
      margin-bottom: 2.5rem;
      animation: fade-in-down 0.7s ease-out 0.2s both;
    }

    .card {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: fade-in-up 0.7s ease-out 0.3s both;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .card-subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 2rem;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }

    .field input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: #f1f5f9;
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(71, 85, 105, 0.6);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input::placeholder {
      color: #475569;
    }

    .field input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .forgot-link {
      display: block;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 600;
      color: #6ee7b7;
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #34d399;
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
      margin-bottom: 1rem;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
      box-shadow: 0 6px 28px rgba(16, 185, 129, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: #64748b;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(71, 85, 105, 0.4);
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: rgba(30, 41, 59, 0.6);
      color: #e2e8f0;
      border: 1px solid rgba(71, 85, 105, 0.5);
    }

    .btn-google:hover {
      background: rgba(51, 65, 85, 0.6);
      border-color: rgba(100, 116, 139, 0.7);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #475569;
      animation: fade-in-up 0.7s ease-out 0.5s both;
    }

    .footer p { font-weight: 600; }

    @keyframes fade-in-down {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    @media (max-width: 480px) {
      .logo { width: 100px; height: 100px; }
      .academy-name { font-size: 1.5rem; }
      .card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <img
        src="https://shooter-academy-new-1vvk.bolt.host/copilot_image_1776165482483-300x300.png"
        alt="شعار أكاديمية شوتر"
        class="logo">
    </div>

    <h1 class="academy-name">أكاديمية شوتر</h1>
    <p class="tagline">فلسفة كرة القدم</p>

    <div class="card">
      <h2 class="card-title">تسجيل الدخول</h2>
      <p class="card-subtitle">مرحباً بعودتك! سجّل دخولك للمتابعة</p>

      <form action="/landing.html" method="post">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <a href="forgot-password.html" class="forgot-link">نسيت كلمة المرور؟</a>

        <button type="submit" class="btn btn-primary">تسجيل الدخول</button>

        <div class="divider">أو</div>

        <button type="button" class="btn btn-google" onclick="window.location.href='landing.html'">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          المتابعة عبر Google
        </button>
      </form>
    </div>

    <div class="footer">
      <p>&copy; 2026 Shooter Academy</p>
    </div>
  </div>
</body>
</html>
