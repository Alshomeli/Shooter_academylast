name: Quality Gate

on:
  push:
    branches: [main, Staging-shooter, feature/family-receipt-intake-no-merge-20261018]
  pull_request:
    branches: [main, Staging-shooter]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
