name: Review homepage image optimization
on:
  pull_request:
    paths:
      - 'scripts/optimize_home_images.py'
      - 'scripts/stage_review_images.py'
      - '.github/workflows/review-home-image-optimization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/mobile-image-optimization-20261121'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image converter
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate review images and validate size
        run: python scripts/optimize_home_images.py
      - name: Stage optimized copies and safe homepage references
        run: python scripts/stage_review_images.py
      - name: Upload review files (not published)
        uses: actions/upload-artifact@v4
        with:
          name: shooter-home-image-review
          path: .image-optimization-review/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
      - name: Commit optimized assets to development branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/AcademyHome.tsx public/shooter-logo-transparent.webp public/images/1000391344.webp public/home/festival-team.webp
          if ! git diff --cached --quiet; then
            git commit -m "Stage optimized public homepage images for review"
            git push origin HEAD:refs/heads/perf/mobile-image-optimization-20261121
          fi
